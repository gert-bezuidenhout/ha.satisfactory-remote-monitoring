name: Release

on:
  push:
    branches: [main]
    paths:
      - custom_components/satisfactory_remote_monitoring/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: satisfactory-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish numbered release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version' custom_components/satisfactory_remote_monitoring/manifest.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -s "docs/releases/$VERSION.md"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "Satisfactory Remote Monitoring $VERSION" --notes-file "docs/releases/$VERSION.md" --latest
